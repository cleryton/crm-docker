<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar conta - CRM Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <p class="subtitle">Leva menos de um minuto</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="registerForm">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="name" required placeholder="Seu nome">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="voce@empresa.com">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="password" required placeholder="mín. 6 caracteres">
        </div>
        <button type="submit" class="btn-primary">Criar conta</button>
      </form>

      <p class="switch-link">Já tem conta? <a href="/login.html">Entrar</a></p>
    </div>
  </div>
  <script src="/js/register.js"></script>
</body>
</html>
