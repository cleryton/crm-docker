<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrar - CRM Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Entre com sua conta para acessar o CRM</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="voce@empresa.com">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <p class="switch-link">Não tem conta? <a href="/register.html">Cadastre-se</a></p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
