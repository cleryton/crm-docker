name: Deploy para a VM Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-docker
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./crm-docker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crm-docker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VM e atualizar o container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            set -e
            echo "Autenticando no Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Puxando a imagem mais recente..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/crm-docker:latest

            echo "Substituindo o container em execução..."
            sudo docker stop crm-demo || true
            sudo docker rm crm-demo || true

            sudo docker run -d \
              --name crm-demo \
              -p 3000:3000 \
              -e PORT=3000 \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -v crm-data:/app/data \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/crm-docker:latest

            echo "Deploy concluído com sucesso!"
